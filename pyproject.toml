[project]
name = "study-implicit-id-extraction"
version = "0.1.0"
description = "Small OpenRouter reproduction of an implicit record-ID extraction diagnostic"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
vague-match = "bench:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bench"]
