[project]
name = "vague-match-mirror"
version = "0.1.0"
description = "Small OpenRouter reproduction of an implicit record-ID extraction diagnostic"
requires-python = ">=3.10"

[project.scripts]
vague-match = "bench:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bench"]
